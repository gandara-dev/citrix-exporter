name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests/CitrixExporter.Tests.ps1 -CI -Output Detailed

  web-tests:
    name: Metrics Playground tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fixtures generated from the PowerShell exporter
        run: node --test tests/web/*.test.mjs

  lint:
    name: PowerShell analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error)
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { throw 'PSScriptAnalyzer reported findings.' }
      - name: Parse Grafana dashboard
        shell: pwsh
        run: Get-Content ./monitoring/grafana/dashboards/citrix-overview.json -Raw | ConvertFrom-Json | Out-Null

  diagram-validation:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render versioned Mermaid sources
        run: |
          for diagram in docs/diagrams/*.mmd; do
            output="/tmp/$(basename "${diagram%.mmd}").svg"
            docker run --rm --volume "$PWD:/data:ro" \
              ghcr.io/mermaid-js/mermaid-cli/mermaid-cli@sha256:a6fb0574dded4086888b5e38476899c9aff8963196f689f11a0f8fceee588ce1 \
              -i "/data/$diagram" -o "$output" -b white
          done

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start monitoring stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify exporter, Prometheus, and Grafana
        shell: pwsh
        run: ./scripts/Test-ComposeStack.ps1 | Format-List
      - name: Verify controlled Broker failure behavior
        shell: pwsh
        run: ./scripts/Test-FailureMode.ps1 | Format-List
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop monitoring stack
        if: always()
        run: docker compose down --volumes
