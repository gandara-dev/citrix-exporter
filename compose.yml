services:
  exporter:
    build:
      context: .
    # Set EXPORTER_SCENARIO to a file in ./scenarios to replay a synthetic incident,
    # for example EXPORTER_SCENARIO=slow-logons.json docker compose up --build.
    command:
      - -ListenAddress
      - 0.0.0.0
      - -Port
      - "9187"
      - -Simulation
      - -ScenarioPath
      - ${EXPORTER_SCENARIO:+/app/scenarios/${EXPORTER_SCENARIO}}
    volumes:
      - ./scenarios:/app/scenarios:ro
    ports:
      - "9187:9187"
    healthcheck:
      test:
        - CMD
        - pwsh
        - -NoLogo
        - -NoProfile
        - -NonInteractive
        - -Command
        - if ((Invoke-WebRequest -Uri http://127.0.0.1:9187/health -TimeoutSec 3).StatusCode -ne 200) { exit 1 }
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      exporter:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.6@sha256:d8276d620291d3aaae3e31dde6d63e6807afee49825f04e8aa7392bbe024216f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Open the dashboard directly instead of the Grafana home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/citrix-overview.json
      # Behind a forwarded URL (for example GitHub Codespaces) Grafana must know
      # its public address, or it rejects the panel queries.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
    volumes:
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
